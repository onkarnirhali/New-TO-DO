    status: not-started
    verification: [api-test, web-test, security-review]
    evidence: []
    implementationNotes: Password-lock API source exists, but entitlements and all mutation protections are incomplete on this branch.
  - id: AC-NOTE-06
    feature: Downgrade preservation
    criterion: Existing locked notes remain usable with proof while new locks and password changes are disabled after downgrade.
    priority: launch-blocker
    status: not-started
