  - id: AC-OPS-01
    feature: Admin user management
    criterion: Master admins list and activate users without data deletion while non-admins are denied.
    priority: pre-launch
    status: not-started
    verification: [api-test, web-test, authorization-test]
    evidence: []
  - id: AC-OPS-02
    feature: Platform health
    criterion: Admin health reports API, database, and storage readiness without exposing secrets.
    priority: pre-launch
    status: implemented
    verification: [api-test, security-review]
    evidence:
      - TASK-018 focused and full API Jest evidence
      - .agent/reviews/packets/TASK-018-freeze.md
    implementationNotes: Admin-only GET /admin/health returns compact API, database, Redis, and R2 readiness statuses. Each dependency probe is deadline-bounded; R2 is aborted on expiry. Independent security review remains required before verification.
  - id: AC-OPS-03
    feature: Clerk webhooks
    criterion: Verified webhook signatures synchronize and deactivate users without starter-data races or duplication.
    priority: pre-launch
    status: not-started
    verification: [api-integration-test, concurrency-test, real-clerk-smoke]
    evidence: []
    implementationNotes: Signature verification and user sync source exist; race and starter-data guarantees are not evidenced.
  - id: AC-OPS-04
    feature: Private R2 release check
    criterion: R2 is non-public and browser assets expose no object URLs, presigned URLs, or credentials; recovery is tested.
    priority: pre-launch
    status: not-started
    verification: [private-r2-smoke, bundle-audit, security-review]
    evidence: []
  - id: AC-OPS-05
    feature: Monitoring and recovery
    criterion: Structured errors and durable cleanup retries recover safely after process or storage failure.
    priority: pre-launch
    status: not-started
    verification: [integration-test, failure-injection-test]
    evidence: []

