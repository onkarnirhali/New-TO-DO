criteria:
  - id: AC-GOV-01
    feature: Governance policies
    criterion: Owner-controlled invariants, authority, documentation, and review policies exist and are validated.
    priority: governance
    status: review
    verification: [governance-test, independent-review]
    evidence: [.agent/tasks/TASK-002-governance-invariants.md]
  - id: AC-GOV-02
    feature: Delivery controller bootstrap
    criterion: Tasks 1 through 6, the delivery ledger, acceptance traceability, automation dry run, and independent review are complete.
    priority: governance
    status: review
    verification: [governance-test, root-gates, independent-review, dry-run]
    evidence: []
  - id: AC-GOV-03
    feature: Independent reviewer contract
    criterion: A repository-owned read-only reviewer contract and evidence template enforce exact approved-only commit and push gates.
    priority: governance
    status: review
    verification: [content-review, independent-review]
    evidence: [.agent/tasks/TASK-001-code-reviewer-agent.md]

  - id: AC-AUTH-01
    feature: Email sign-up
    criterion: A visitor can create an account with name, email, and password, receive accessible verification errors, establish a session, and reach /app.
    priority: launch-blocker
    status: not-started
    verification: [web-test, real-clerk-smoke]
    evidence: []
  - id: AC-AUTH-02
    feature: Email sign-in
    criterion: Valid credentials create a Clerk session and open /app while invalid credentials show a safe clear error.
    priority: launch-blocker
    status: not-started
    verification: [web-test, real-clerk-smoke]
    evidence: []
  - id: AC-AUTH-03
    feature: Google OAuth
    criterion: Clerk oauth_google completes through /sso-callback for new and returning users with safe cancel and error handling.
    priority: launch-blocker
    status: not-started
    verification: [web-test, real-clerk-smoke]
    evidence: []
  - id: AC-AUTH-04
    feature: Password reset
    criterion: A user can request and complete Clerk email-code password reset without logging secrets.
    priority: launch-blocker
    status: not-started
    verification: [web-test, real-clerk-smoke]
    evidence: []
  - id: AC-AUTH-05
    feature: Route protection
    criterion: Unauthenticated /app routes are denied, public auth routes remain reachable, and API requests use a fresh Clerk bearer token.
    priority: launch-blocker
    status: not-started
    verification: [middleware-test, api-client-test, browser-smoke]
    evidence: []
    implementationNotes: API guards exist, but the checked-in web app lacks Clerk middleware and token wiring.
  - id: AC-AUTH-06
    feature: Account profile
    criterion: Trusted Clerk identity or initials appear in navigation and sign-out ends the session.
    priority: launch-blocker
    status: not-started
    verification: [web-test, browser-smoke]
    evidence: []
  - id: AC-AUTH-07
    feature: User bootstrap
    criterion: First protected access synchronizes one active local user and exactly one starter board with To Do, In Progress, and Done columns.
    priority: launch-blocker
    status: not-started
    verification: [api-integration-test, concurrency-test]
    evidence: []

  - id: AC-SHELL-01
    feature: Responsive app shell
    criterion: Authenticated pages provide accessible sidebar, top navigation, skip link, and main target at desktop and narrow widths.
    priority: launch-blocker
    status: not-started
    verification: [web-test, accessibility-test, browser-smoke]
    evidence: []
    implementationNotes: A desktop shell exists, but responsive and accessibility criteria are not fully evidenced.
  - id: AC-SHELL-02
    feature: Dashboard and Notes navigation
    criterion: Users can navigate among /app, dashboards, and Notes without broken handoffs.
    priority: launch-blocker
    status: not-started
    verification: [web-test, browser-smoke]
    evidence: []
  - id: AC-SHELL-03
    feature: Theme support
    criterion: Dark mode defaults, light mode uses the approved palette, and user preference can be changed and retained.
    priority: launch-blocker
    status: not-started
    verification: [web-test, visual-smoke]
    evidence: []
    implementationNotes: Dark mode is hardcoded; switching and persistence are absent.
  - id: AC-SHELL-04
    feature: Accessibility baseline
    criterion: Focus, names, dialogs, non-colour status, and key flows pass automated accessibility checks.
    priority: launch-blocker
    status: not-started
    verification: [accessibility-test, keyboard-review]
    evidence: []

  - id: AC-KANBAN-01
    feature: Dashboard CRUD
    criterion: Users create, rename, and remove only owned dashboards and each new dashboard atomically gets three default columns.
    priority: launch-blocker
    status: not-started
    verification: [api-test, web-test, browser-smoke]
    evidence: []
    implementationNotes: Dashboard API source exists, but default-column atomicity and web workflow are not complete on this branch.
  - id: AC-KANBAN-02
    feature: Column management
    criterion: Users add, rename, order, and safely remove columns without hiding placed tasks.
    priority: launch-blocker
    status: not-started
    verification: [api-test, web-test]
    evidence: []
  - id: AC-KANBAN-03
    feature: Board view
    criterion: Owned columns and tasks render with understandable loading, empty, and retry states.
    priority: launch-blocker
    status: not-started
    verification: [api-test, web-test, browser-smoke]
    evidence: []
  - id: AC-KANBAN-04
    feature: Drag and drop
    criterion: Pointer and keyboard moves preserve order, support empty columns, and roll back safely on failure.
    priority: launch-blocker
    status: not-started
    verification: [web-test, accessibility-test, browser-smoke]
    evidence: []
  - id: AC-KANBAN-05
    feature: Shared tasks
    criterion: Dashboard placements move independently and the final placement cannot be removed.
    priority: launch-blocker
    status: not-started
    verification: [api-test, web-test]
    evidence: []

